name: Adjust → BigQuery Sync (v3.2 — parallel reports)

on:
  schedule:
    # Daily refresh Mon-Sat
    - cron: '17 2 * * 1-6'
    # Weekly deep refresh Sunday
    - cron: '47 3 * * 0'

  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Flat reports rolling window (days)'
        required: false
        default: '14'
      cohort_lookback_days:
        description: 'Cohort rolling window (days)'
        required: false
        default: '150'
      chunk_size:
        description: 'App tokens per Adjust request'
        required: false
        default: '25'
      metric_batch_size:
        description: 'Metrics per Adjust request batch'
        required: false
        default: '35'
      reports:
        description: 'Comma-separated: app,campaign,country,spend,cohort,event,event_cohort'
        required: false
        default: 'app,campaign,country,spend,cohort,event,event_cohort'
      cohort_periods:
        description: 'all_days | all_periods | key | comma list'
        required: false
        default: 'all_days'
      event_cohort_periods:
        description: 'key | all_days | comma list'
        required: false
        default: 'key'
      include_weekly_monthly_cohorts:
        description: '1 = include weekly/monthly cohort periods'
        required: false
        default: '0'
      start_date:
        description: 'Optional YYYY-MM-DD backfill start'
        required: false
        default: ''
      end_date:
        description: 'Optional YYYY-MM-DD backfill end'
        required: false
        default: ''
      dry_run:
        description: '1 = no BigQuery writes'
        required: false
        default: '0'

concurrency:
  group: adjust-bigquery-sync-v32
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Build Adjust run profile
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.profile.outputs.matrix }}
      lookback: ${{ steps.profile.outputs.lookback }}
      cohort_lookback: ${{ steps.profile.outputs.cohort_lookback }}
      chunk: ${{ steps.profile.outputs.chunk }}
      metric_batch: ${{ steps.profile.outputs.metric_batch }}
      cohort_periods: ${{ steps.profile.outputs.cohort_periods }}
      event_periods: ${{ steps.profile.outputs.event_periods }}
      include_wm: ${{ steps.profile.outputs.include_wm }}
      start_date: ${{ steps.profile.outputs.start_date }}
      end_date: ${{ steps.profile.outputs.end_date }}
      dry_run: ${{ steps.profile.outputs.dry_run }}
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - name: Build profile + report matrix
        id: profile
        shell: bash
        env:
          INPUT_LOOKBACK: ${{ inputs.lookback_days || '14' }}
          INPUT_COHORT_LOOKBACK: ${{ inputs.cohort_lookback_days || '150' }}
          INPUT_CHUNK: ${{ inputs.chunk_size || '25' }}
          INPUT_METRIC_BATCH: ${{ inputs.metric_batch_size || '35' }}
          INPUT_REPORTS: ${{ inputs.reports || 'app,campaign,country,spend,cohort,event,event_cohort' }}
          INPUT_COHORT_PERIODS: ${{ inputs.cohort_periods || 'all_days' }}
          INPUT_EVENT_PERIODS: ${{ inputs.event_cohort_periods || 'key' }}
          INPUT_INCLUDE_WM: ${{ inputs.include_weekly_monthly_cohorts || '0' }}
          INPUT_START_DATE: ${{ inputs.start_date || '' }}
          INPUT_END_DATE: ${{ inputs.end_date || '' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: |
          set -euo pipefail

          PROFILE='manual'
          LOOKBACK="$INPUT_LOOKBACK"
          COHORT_LOOKBACK="$INPUT_COHORT_LOOKBACK"
          REPORTS="$INPUT_REPORTS"
          COHORT_PERIODS="$INPUT_COHORT_PERIODS"
          EVENT_PERIODS="$INPUT_EVENT_PERIODS"
          INCLUDE_WM="$INPUT_INCLUDE_WM"

          if [[ '${{ github.event_name }}' == 'schedule' ]]; then
            REPORTS='app,campaign,country,spend,cohort,event,event_cohort'
            if [[ '${{ github.event.schedule }}' == '47 3 * * 0' ]]; then
              PROFILE='weekly-deep'
              LOOKBACK='30'
              COHORT_LOOKBACK='180'
              COHORT_PERIODS='all_periods'
              EVENT_PERIODS='all_days'
              INCLUDE_WM='1'
            else
              PROFILE='daily'
              LOOKBACK='14'
              COHORT_LOOKBACK='150'
              COHORT_PERIODS='all_days'
              EVENT_PERIODS='key'
              INCLUDE_WM='0'
            fi
          fi

          MATRIX=$(REPORTS="$REPORTS" python - <<'PY'
          import json, os
          allowed = ['app','campaign','country','spend','cohort','event','event_cohort']
          requested = {x.strip() for x in os.environ['REPORTS'].split(',') if x.strip()}
          selected = [x for x in allowed if x in requested]
          if not selected:
              raise SystemExit('No valid reports selected')
          print(json.dumps({'report': selected}, separators=(',', ':')))
          PY
          )

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "lookback=$LOOKBACK" >> "$GITHUB_OUTPUT"
          echo "cohort_lookback=$COHORT_LOOKBACK" >> "$GITHUB_OUTPUT"
          echo "chunk=$INPUT_CHUNK" >> "$GITHUB_OUTPUT"
          echo "metric_batch=$INPUT_METRIC_BATCH" >> "$GITHUB_OUTPUT"
          echo "cohort_periods=$COHORT_PERIODS" >> "$GITHUB_OUTPUT"
          echo "event_periods=$EVENT_PERIODS" >> "$GITHUB_OUTPUT"
          echo "include_wm=$INCLUDE_WM" >> "$GITHUB_OUTPUT"
          echo "start_date=$INPUT_START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$INPUT_END_DATE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$INPUT_DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

          echo "Profile: $PROFILE"
          echo "Reports matrix: $MATRIX"
          echo "Flat lookback: $LOOKBACK"
          echo "Cohort lookback: $COHORT_LOOKBACK"

  sync:
    name: Adjust ${{ matrix.report }} → BigQuery
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Two report families at once. Each job can use 4 concurrent Adjust HTTP calls,
      # so account-wide concurrency stays around 8 instead of exploding to 40+.
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify loader
        run: |
          set -euo pipefail
          test -f adjust_to_bigquery.py
          python -m py_compile adjust_to_bigquery.py
          grep -q 'v3.2 PARALLEL-REPORT' adjust_to_bigquery.py || {
            echo '::error::Repo is not running the v3.2 parallel-report loader'
            exit 1
          }

      - name: Run ${{ matrix.report }} report
        env:
          ADJUST_API_TOKEN: ${{ secrets.ADJUST_API_TOKEN }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          ADJUST_APP_TOKENS: ${{ secrets.ADJUST_APP_TOKENS }}

          APP_TOKENS_FILE: app_tokens.txt
          BQ_DATASET: adjust_data
          BQ_LOCATION: US

          LOOKBACK_DAYS: ${{ needs.prepare.outputs.lookback }}
          COHORT_LOOKBACK_DAYS: ${{ needs.prepare.outputs.cohort_lookback }}
          START_DATE: ${{ needs.prepare.outputs.start_date }}
          END_DATE: ${{ needs.prepare.outputs.end_date }}

          CHUNK_SIZE: ${{ needs.prepare.outputs.chunk }}
          METRIC_BATCH_SIZE: ${{ needs.prepare.outputs.metric_batch }}

          # Per-job concurrency. With max-parallel=2 above, global steady-state
          # Adjust concurrency is bounded around 8 requests.
          MAX_WORKERS: '4'
          MAX_HTTP_IN_FLIGHT: '4'
          MAX_RETRIES: '6'
          REQUEST_TIMEOUT: '300'

          REPORTS: ${{ matrix.report }}
          COHORT_PERIODS: ${{ needs.prepare.outputs.cohort_periods }}
          EVENT_COHORT_PERIODS: ${{ needs.prepare.outputs.event_periods }}
          INCLUDE_WEEKLY_MONTHLY_COHORTS: ${{ needs.prepare.outputs.include_wm }}
          COHORT_MATURITIES: 'immature,mature'

          ATTRIBUTION_SOURCE: dynamic
          ATTRIBUTION_TYPES: ''
          AD_SPEND_MODE: network
          SPEND_RECON_MODES: 'adjust,network,mixed'

          REPORTING_CURRENCY: USD
          UTC_OFFSET: '+00:00'
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}

          # Only one concurrent matrix job should rewrite the shared catalogs.
          PERSIST_CATALOGS: ${{ matrix.report == 'app' && '1' || '0' }}

        run: python adjust_to_bigquery.py

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Adjust report: ${{ matrix.report }}"
            echo "- Profile: **${{ needs.prepare.outputs.profile }}**"
            echo "- Result: **${{ job.status }}**"
            echo "- Per-job workers: **4**"
            echo "- Per-job HTTP cap: **4**"
          } >> "$GITHUB_STEP_SUMMARY"

  final:
    name: Adjust sync summary
    needs: [prepare, sync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Final result
        run: |
          echo "Profile: ${{ needs.prepare.outputs.profile }}"
          echo "Matrix result: ${{ needs.sync.result }}"
          if [[ '${{ needs.sync.result }}' != 'success' ]]; then
            echo '::error::One or more Adjust report jobs failed/cancelled. Check the individual matrix job.'
            exit 1
          fi
          echo '✅ All selected Adjust report families completed.'
