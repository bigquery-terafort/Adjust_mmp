name: Adjust → BigQuery Sync (v2 — sab kuch)

# ═══════════════════════════════════════════════════════════════════════════
#  SETUP — ek baar
#  ──────────────
#  Settings → Secrets and variables → Actions → New repository secret:
#
#    ADJUST_API_TOKEN        Adjust global API token
#    GCP_PROJECT             GCP project id
#    GCP_CREDENTIALS_JSON    service-account JSON — POORA content paste karo
#                            (roles: BigQuery Data Editor + Job User)
#    ADJUST_APP_TOKENS       (optional) 200 tokens comma-separated
#
#  App tokens ke liye do rasté:
#    A) ADJUST_APP_TOKENS secret — comma-separated
#    B) repo mein `app_tokens.txt` — ek token per line, `#` se comment
#       200 tokens ke liye (B) zyada aasan hai: git diff se pata chalta hai
#       ke kaunsa app kab add/remove hua.
#
#  ⚠️ PEHLA RUN "Run workflow" se, dry_run = 1 rakh ke karo.
#     Wo BigQuery ko haath nahi lagata — sirf dikhata hai kitne rows aaye.
# ═══════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # 🔁 HAR 15 MINUTE — public repo par Actions FREE hai.
    #    Har run pehle BQ se poochti hai "kal ka data hai?" — hai to 10 sec
    #    mein skip. Nahi to poora loader (45 din MERGE). Der ≤ ~20 min.
    - cron: '*/15 * * * *'

  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Kitne din pichhe tak (default 30)"
        required: false
        default: '45'
      chunk_size:
        description: "Ek request mein kitne app tokens (0 = sab ek saath)"
        required: false
        default: "50"
      reports:
        description: "Kaunsi tables — app,campaign,country (comma se)"
        required: false
        default: "app,campaign,country"
      dry_run:
        description: "1 = fetch karo lekin BigQuery ko haath mat lagao"
        required: false
        default: "0"

# 🛡️ Do run ek saath chalein to dono DELETE karenge — bacho.
concurrency:
  group: adjust-bigquery-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync Adjust → BigQuery
    runs-on: ubuntu-latest
    # Bounded — na be-had, na itna chhota ke retries ka mauqa hi na mile.
    # (Ek purane loader ko GitHub ne 60-min pe maar diya tha jab wo 80% pe
    #  atka hua tha; script ke apne timeouts ko chalne ka mauqa milna chahiye.)
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # requirements.txt repo root mein hona chahiye — `cache: pip` usi ko
      # hash karta hai. Agar wo file na ho to setup-python step FAIL ho jata
      # hai (run #2 mein yehi hua).
      # ══════════════════════════════════════════════════════════════════════
      # 🔧 bq CLI — self-heal/verify ke liye. WAHI secret jo loader use karta hai.
      #    Koi naya secret nahi.
      # ══════════════════════════════════════════════════════════════════════
      - name: "🔑 GCP auth (bq ke liye)"
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: "🔧 setup-gcloud (bq CLI)"
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      # ══════════════════════════════════════════════════════════════════════
      # 🩺 SELF-HEAL ① — PEHLE ki haalat yaad rakho (rollback/verify ke liye)
      # ══════════════════════════════════════════════════════════════════════
      - name: "🩺 Pehle ki haalat — rows aur aakhri din"
        id: before
        continue-on-error: true
        run: |
          set +e
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(date) AS STRING) FROM \`terafort.adjust_data.app_daily_performance\`" 2>/dev/null | tail -1)
          ROWS=$(echo "$R" | cut -d, -f1); LAST=$(echo "$R" | cut -d, -f2)
          echo "📊 pehle: ${ROWS:-?} rows · aakhri din ${LAST:-?}"
          echo "rows=${ROWS:-0}" >> "$GITHUB_OUTPUT"
          echo "last=${LAST:-}"  >> "$GITHUB_OUTPUT"
          # ── gap dekh kar lookback tay karo ──
          LB="${{ github.event.inputs.lookback_days || '45' }}"
          if [[ "$LAST" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            GAP=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
            if [ "$GAP" -gt "$LB" ]; then
              LB=$(( GAP + 3 )); [ "$LB" -gt 180 ] && LB=180
              echo "::warning::🩺 Self-heal: data ${GAP} din purana — lookback ${LB} kiya"
            fi
          else
            # ── 🛡️ SAFETY NET: bq nahi chala (setup-gcloud nahi?) ──
            #    Bina jaanch ke har 15 min poora loader chalana = platform API par
            #    bojh (rate limit). Is liye sirf GHANTE KE SHURU mein chalao
            #    (:00–:14) — yani purane 1-ghanta cron jaisa. Baqi 15-min skip.
            MIN=$((10#$(date -u +%M)))
            if [ "$MIN" -ge 15 ]; then
              echo "⚠️ BQ check nahi ho saka — sirf ghante ke shuru mein chalta hoon (abhi :$MIN) — skip"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "lookback=$LB" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "⚠️ BQ check nahi ho saka — ghante ka shuru hai, loader chalega (lookback $LB)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ── 🔑 SKIP: kal ka data pehle se hai to kuch mat karo ──
          YESTERDAY=$(date -u -d yesterday +%F)
          if [[ "$LAST" > "$YESTERDAY" ]] || [[ "$LAST" == "$YESTERDAY" ]]; then
            echo "✅ kal ka data ($LAST) pehle se hai — skip, kuch nahi karna"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "🔍 kal ($YESTERDAY) ka data nahi — loader chalega"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "lookback=$LB" >> "$GITHUB_OUTPUT"

      # 🔁 RETRY — neeche wala main step 3 baar koshish karta hai.
      #    (nick-fields/retry se: platform API 5xx / timeout par khud dobara)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Adjust → BigQuery sync
        if: steps.before.outputs.skip != 'true'
        env:
          # ── secrets ──
          ADJUST_API_TOKEN:     ${{ secrets.ADJUST_API_TOKEN }}
          GCP_PROJECT:          ${{ secrets.GCP_PROJECT }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          ADJUST_APP_TOKENS:    ${{ secrets.ADJUST_APP_TOKENS }}

          # ── config ──
          APP_TOKENS_FILE:  app_tokens.txt
          BQ_DATASET:       adjust_data
          BQ_LOCATION:      US
          LOOKBACK_DAYS:    ${{ steps.before.outputs.lookback || github.event.inputs.lookback_days || '45' }}
          CHUNK_SIZE:       ${{ github.event.inputs.chunk_size    || '25' }}
          DRY_RUN:          ${{ github.event.inputs.dry_run       || '0'  }}
          # Kaunsi tables banani hain. Teeno = app,campaign,country
          # Ek hi chahiye to sirf uska key likho, jaise: campaign
          REPORTS:          ${{ github.event.inputs.reports || 'app,campaign,country' }}
          MAX_RETRIES:      "5"
          REQUEST_TIMEOUT:  "300"
          UTC_OFFSET:       "+00:00"
          ATTRIBUTION_TYPE: "all"
        run: python adjust_to_bigquery.py

      # Script khud exit(1) karti hai jab koi masla ho (chahe kuch data
      # load ho chuka ho). Ye step usay saaf tarah surface karta hai —
      # taake koi run "green" dikhte hue chup-chaap data na khaye.
      - name: Fail loudly
        if: failure()
        run: |
          echo "::error::Adjust sync FAILED — upar ke logs mein 🔴 dhoondo."
          echo "Jin apps ka fetch fail hua, unka purana data CHHUA NAHI gaya."
          exit 1

  # ═══════════════════════════════════════════════════════════════════════════
  # KEEPALIVE — GitHub ka 60-din auto-disable
  # ─────────────────────────────────────────
  # GitHub 60 din tak repo mein koi commit na ho to scheduled workflows KHUD
  # band kar deta hai. Owner ko email jata hai, jo aksar kisi ne nahi dekha.
  #
  # Ye theory nahi — tareekhon se saabit hai:
  #     fx_rate   aakhri commit Apr 26 + 60 = Jun 25  →  data ruka Jun 26
  #     admob ×3  aakhri commit May 20 + 60 = Jul 19  →  data ruka Jul 19
  # Nuqsan: ~$27K AdMob revenue + 30 din FX rates, kisi ko pata bhi nahi chala.
  #
  # Ye job mahine ki 1 tareekh ko ek dummy commit karta hai — ghadi reset.
  # ═══════════════════════════════════════════════════════════════════════════

      # ══════════════════════════════════════════════════════════════════════
      # 🛡️ SELF-HEAL ② — BAAD mein VERIFY. Kharab data mile to run LAAL.
      # ══════════════════════════════════════════════════════════════════════
      #  Teen check:
      #    1. rows KAM to nahi ho gaye  (koi loader TRUNCATE kar ke mar gaya?)
      #    2. aakhri din PEECHE to nahi gaya
      #    3. aaj ke window mein NEGATIVE ya NULL key to nahi
      #  Koi bhi fail → exit 1 → workflow red → tum ko pata chalega.
      #  🔑 Loader khud MERGE karta hai, is liye rollback ki zaroorat nahi —
      #     purana data waise hi mehfooz rehta hai.
      - name: "🛡️ Baad mein verify — bad data nahi jaana chahiye"
        if: always() && steps.before.outputs.skip != 'true'
        run: |
          set +e
          BEFORE_ROWS="${{ steps.before.outputs.rows || '0' }}"
          BEFORE_LAST="${{ steps.before.outputs.last || '' }}"
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(date) AS STRING), COUNTIF(date IS NULL) FROM \`terafort.adjust_data.app_daily_performance\`" 2>/dev/null | tail -1)
          if [ -z "$R" ]; then
            echo "::warning::verify skip — bq query nahi chali (setup-gcloud hai?)"
            exit 0
          fi
          AFTER_ROWS=$(echo "$R" | cut -d, -f1); AFTER_LAST=$(echo "$R" | cut -d, -f2); NULLS=$(echo "$R" | cut -d, -f3)
          echo "📊 baad:  ${AFTER_ROWS} rows · aakhri din ${AFTER_LAST} · null dates ${NULLS}"
          FAIL=0
          # 1. rows 5% se zyada KAM ho gaye = kuch toota
          if [ "$BEFORE_ROWS" -gt 100 ] && [ "$AFTER_ROWS" -lt $(( BEFORE_ROWS * 95 / 100 )) ]; then
            echo "::error::🔴 ROWS KAM HO GAYE: $BEFORE_ROWS → $AFTER_ROWS — loader ne data URA DIYA"; FAIL=1
          fi
          # 2. aakhri din peeche gaya
          if [[ "$BEFORE_LAST" =~ ^[0-9]{4} ]] && [[ "$AFTER_LAST" < "$BEFORE_LAST" ]]; then
            echo "::error::🔴 AAKHRI DIN PEECHE GAYA: $BEFORE_LAST → $AFTER_LAST"; FAIL=1
          fi
          # 3. null date key
          if [ "${NULLS:-0}" -gt 0 ]; then
            echo "::error::🔴 ${NULLS} rows par date NULL hai — kharab data"; FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "::error::🔴 VERIFY FAIL — is run ka data bharosay ke qabil NAHI"
            exit 1
          fi
          echo "✅ verify pass — $(( AFTER_ROWS - BEFORE_ROWS )) rows badhe"

      # ══════════════════════════════════════════════════════════════════════
      # 📣 NAKAAMI PAR BATAO — chup-chaap fail na ho
      # ══════════════════════════════════════════════════════════════════════
      - name: "📣 Fail hua to summary mein likho"
        if: failure()
        run: |
          {
            echo "## 🔴 ${{ github.workflow }} — NAKAAM"
            echo "- run: ${{ github.run_id }}"
            echo "- waqt: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- pehle: ${{ steps.before.outputs.rows }} rows · ${{ steps.before.outputs.last }}"
            echo "- 🔁 agli scheduled run khud dobara koshish karegi (din mein 4x)"
            echo "- 🩺 self-heal gap dekh kar lookback barha dega"
          } >> "$GITHUB_STEP_SUMMARY"

  keepalive:
    name: Keepalive (60-din auto-disable se bachao)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Touch repo (mahine mein ek baar)
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Aaj 1 tareekh nahi — skip"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name  "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive [skip ci]" || exit 0
          git push
